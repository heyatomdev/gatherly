packages:
  - '.'

allowBuilds:
  '@scarf/scarf': false
  '@prisma/engines': true
  prisma: true
  # testcontainers' optional native SSH deps — not needed for a local Docker socket
  cpu-features: false
  protobufjs: false
  ssh2: false

# Transitive CVE fixes: drop each once the parent ships it
# (multer via @nestjs/platform-express 11, mysql2 + deepmerge-ts via prisma 7 CLI).
overrides:
  proxy-addr: '>=2.0.8'
  multer: ^2.4.0
  mysql2: ^3.22.0
  deepmerge-ts: ^8.0.0
  js-yaml: ^4.3.2
  fast-uri: ^3.1.8
